# Change prefix from Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (scrolling and pane selection)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Increase scrollback buffer size
set -g history-limit 50000

# Enable 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Pass through extended keys (Shift+Enter, Ctrl+Enter, etc.) to applications
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Vi mode for copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Tmux Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless navigation between tmux panes and vim splits
set -g @plugin 'christoomey/vim-tmux-navigator'

# Better mouse support
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Session persistence — save/restore all windows, panes, and paths
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'      # save pane content too
set -g @resurrect-strategy-nvim 'session'          # restore nvim sessions
set -g @continuum-restore 'on'                     # auto-restore on tmux start
set -g @continuum-save-interval '10'               # auto-save every 10 min

# Sessionizer — fuzzy jump to any project, creates session if not exists
# Requires: fzf installed (brew install fzf)
bind f run-shell "~/.local/bin/tmux-sessionizer"
bind F display-popup -E "~/.local/bin/tmux-sessionizer"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
